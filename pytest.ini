[pytest]
# The house suite lives in tests/. surface-mirror/ holds PUBLISHED copies of
# other projects' skills, and some of those carry their own test files with
# their own optional dependencies - the docx skill's test imports python-docx,
# which the evolution stack does not depend on. Without this scope a plain
# `pytest` at the repo root tried to collect the mirror and died on an
# ImportError that had nothing to do with this project.
testpaths = tests

# Keep pytest's own defaults, and add the mirror and the scratch dirs.
norecursedirs = .* build dist node_modules venv {arch} surface-mirror .venv __pycache__ *.egg-info
